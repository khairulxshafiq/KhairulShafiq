  <text class="sub" x="68" y="470">Scopes, architects, oversees delivery, and advises on IT and AI.</text>
  <rect x="68" y="528" width="1064" height="1" fill="#ddd4c4"/>
  <text class="foot" x="68" y="574">Microsoft 365   ·   Entra ID   ·   Intune   ·   AI architecture</text>
