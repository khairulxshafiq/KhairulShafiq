    .place { font-family: Outfit, sans-serif; font-weight: 600; font-size: 18px; letter-spacing: 2.4px; fill: #514b42; }
    .ks { font-family: Outfit, sans-serif; font-weight: 640; font-size: 30px; fill: #f6f1e7; }
