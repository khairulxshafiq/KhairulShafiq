  <rect width="1200" height="630" fill="#f3efe6"/>
  <rect width="16" height="630" fill="#123f3c"/>
  <rect x="68" y="58" width="72" height="72" rx="16" fill="#123f3c"/>
  <text class="ks" x="104" y="103" text-anchor="middle">KS</text>
