<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Khairul Shafiq, technology advisor and solution lead">
  <style>
    @font-face {
      font-family: Fraunces;
      src: url("assets/fonts/fraunces-latin.woff2") format("woff2");
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: Outfit;
      src: url("assets/fonts/outfit-latin.woff2") format("woff2");
      font-weight: 100 900;
      font-display: swap;
    }
    .name { font-family: Fraunces, Georgia, serif; font-weight: 560; font-size: 86px; letter-spacing: -1.2px; fill: #1b1914; }
    .legal { font-family: Outfit, sans-serif; font-weight: 500; font-size: 28px; fill: #3a342c; }
    .role { font-family: Fraunces, Georgia, serif; font-weight: 520; font-size: 40px; fill: #123f3c; }
    .sub { font-family: Outfit, sans-serif; font-weight: 450; font-size: 22px; fill: #3a342c; }
    .foot { font-family: Outfit, sans-serif; font-weight: 600; font-size: 20px; fill: #514b42; }
