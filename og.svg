      font-weight: 100 900;
      font-display: swap;
    }
    .name { font-family: Inter, sans-serif; font-weight: 800; font-size: 84px; letter-spacing: -2.4px; fill: #f2f4ff; }
    .role { font-family: Inter, sans-serif; font-weight: 700; font-size: 36px; letter-spacing: -0.6px; fill: url(#name); }
    .sub { font-family: Inter, sans-serif; font-weight: 500; font-size: 24px; fill: #b7bddf; }
    .foot { font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 16px; letter-spacing: 1px; fill: #94a3b8; }
    .url { font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 16px; fill: #93c5fd; }
    .place { font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 16px; letter-spacing: 2.2px; fill: #94a3b8; }
